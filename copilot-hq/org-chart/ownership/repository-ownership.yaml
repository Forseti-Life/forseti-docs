# Repository ownership is defined at the repo / release-target level.
# Use this file for repository -> product/team routing.
# Each repository/release-target has exactly one owning product team.
# Use module-ownership.yaml for module-level splits within a product/site.
# Seat file scopes may allow work inside a repo, but do not create additional repo owners.

repositories:
  .github:
    github: "Forseti-Life/.github"
    local_path: "/home/ubuntu/forseti.life/community/.github"
    website_scope: "community"
    product_team: "community"
    repo_type: "community-meta"
    owning_pm: "pm-infra"
    owning_dev: "dev-infra"
    owning_qa: "qa-infra"
    owning_security: "sec-analyst-open-source"
    notes: "Community-wide GitHub defaults, workflows, and templates live in the dedicated /home/ubuntu/forseti.life/community workspace."

  ai-conversation:
    github: "Forseti-Life/forseti-ai-conversation"
    local_path: "/home/ubuntu/forseti.life/ai-conversation"
    website_scope: "forseti.life"
    product_team: "forseti.life"
    repo_type: "submodule"
    module: "ai_conversation"
    owning_pm: "pm-forseti"
    owning_dev: "dev-forseti"
    owning_qa: "qa-forseti"
    owning_security: "sec-analyst-forseti"
    notes: "Canonical local checkout for the shared ai_conversation module."

  copilot-hq:
