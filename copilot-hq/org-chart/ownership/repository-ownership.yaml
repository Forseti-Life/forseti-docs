    owning_qa: "qa-forseti-agent-tracker"
    owning_security: "sec-analyst-forseti-agent-tracker"
    notes: "Canonical HQ working tree is `/home/ubuntu/forseti.life/copilot-hq`. The parent `/home/ubuntu/forseti.life` directory is the shared workspace container for sibling product/module repositories and must not be treated as the HQ git root or inbox-scan root. Authoritative repo owner is the Forseti Agent Tracker team; other seats may work in this repo only within their explicitly defined seat-level file scopes."

