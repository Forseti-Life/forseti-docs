# Expected live Drupal custom-module symlink bridges.
# These paths are validated by scripts/ceo-repo-health.sh.
# The link path must remain a symlink and the target path must be a managed git checkout.

custom_module_links:
  - site: "dungeoncrawler"
    module: "ai_conversation"
    link_path: "/var/www/html/dungeoncrawler/web/modules/custom/ai_conversation"
    target_path: "/home/ubuntu/forseti.life/ai-conversation"
  - site: "dungeoncrawler"
    module: "dungeoncrawler_content"
    link_path: "/var/www/html/dungeoncrawler/web/modules/custom/dungeoncrawler_content"
